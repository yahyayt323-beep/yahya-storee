<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="MIMOO YAHYA STORE - متجر الإكسسوارات">

    <title>MIMOO | YAHYA STORE</title>

    <style>

        /* =========================================
           GENERAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Arial, Tahoma, sans-serif;
            overflow-x: hidden;
        }

        button,
        a {
            font-family: inherit;
        }


        /* =========================================
           COLORS
        ========================================= */

        :root {
            --gold: #f5b52b;
            --gold-light: #ffc94d;
            --black: #080808;
            --dark: #111111;
            --dark-2: #171717;
            --border: #292929;
            --gray: #999999;
            --green: #25D366;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            width: 100%;
            min-height: 82px;

            background: #0b0b0b;

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 5%;

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;

            border: 2px solid var(--gold);

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--gold);

            font-size: 30px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .logo-text h2 {
            color: var(--gold);

            font-size: 21px;

            letter-spacing: 3px;
        }

        .logo-text p {
            color: #aaaaaa;

            font-size: 12px;

            margin-top: 3px;
        }


        /* NAVIGATION */

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            transition: 0.3s;
        }

        nav a:hover {
            color: var(--gold);
        }


        /* CART BUTTON */

        .cart-button {
            background: transparent;

            border: 1px solid var(--gold);

            color: var(--gold);

            padding: 11px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            transition: 0.3s;
        }

        .cart-button:hover {
            background: var(--gold);

            color: #000000;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {
            width: 90%;

            max-width: 1300px;

            min-height: 350px;

            margin: 35px auto;

            border: 1px solid var(--border);

            border-radius: 24px;

            background:
                radial-gradient(
                    circle at center,
                    #1b1b1b,
                    #0b0b0b 65%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 45px;

            line-height: 1.4;

            margin-bottom: 15px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            color: #aaaaaa;

            font-size: 19px;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .hero-button {
            display: inline-block;

            background: var(--gold);

            color: #080808;

            text-decoration: none;

            padding: 14px 30px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.3s;
        }

        .hero-button:hover {
            background: var(--gold-light);

            transform: translateY(-3px);
        }


        /* =========================================
           SECTIONS
        ========================================= */

        .section {
            width: 90%;

            max-width: 1300px;

            margin: 55px auto;
        }

        .section-title {
            font-size: 30px;

            margin-bottom: 25px;

            text-align: right;
        }

        .section-title span {
            color: var(--gold);
        }


        /* =========================================
           PRODUCTS
        ========================================= */

        .products {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;
        }


        /* PRODUCT */

        .product {
            width: 100%;

            min-width: 0;

            background: var(--dark);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 15px;

            overflow: hidden;

            transition: 0.3s;
        }

        .product:hover {
            border-color: var(--gold);

            transform: translateY(-4px);
        }


        /* PRODUCT IMAGE */

        .product-img {
            width: 100%;

            height: 210px;

            background: var(--dark-2);

            border-radius: 13px;

            overflow: hidden;

            margin-bottom: 15px;
        }

        .product-img img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* PRODUCT TITLE */

        .product h3 {
            font-size: 18px;

            line-height: 1.6;

            margin-bottom: 8px;
        }


        /* PRODUCT DESCRIPTION */

        .product-description {
            color: var(--gray);

            font-size: 14px;

            line-height: 1.8;

            min-height: 52px;

            margin-bottom: 12px;
        }


        /* PRICE */

        .price {
            color: var(--gold);

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 13px;
        }


        /* BUY BUTTON */

        .buy-button {
            width: 100%;

            padding: 12px;

            background: transparent;

            color: var(--gold);

            border: 1px solid var(--gold);

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            transition: 0.3s;
        }

        .buy-button:hover {
            background: var(--gold);

            color: #000000;
        }


        /* =========================================
           CONTACT
        ========================================= */

        .contact {
            background: var(--dark);

            border: 1px solid var(--border);

            border-radius: 18px;

            text-align: center;

            padding: 30px 20px;
        }

        .contact h2 {
            font-size: 27px;

            margin-bottom: 10px;
        }

        .contact p {
            color: var(--gray);

            margin-bottom: 20px;
        }

        .whatsapp-button {
            display: inline-block;

            background: var(--green);

            color: #ffffff;

            text-decoration: none;

            padding: 14px 28px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.3s;
        }

        .whatsapp-button:hover {
            transform: translateY(-3px);
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {
            border-top: 1px solid var(--border);

            color: #777777;

            text-align: center;

            padding: 30px 15px;

            margin-top: 60px;

            font-size: 14px;
        }


        /* =========================================
           CART OVERLAY
        ========================================= */

        .cart-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.8);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 15px;

            z-index: 2000;
        }

        .cart-overlay.show {
            display: flex;
        }


        /* CART BOX */

        .cart-box {
            width: 100%;

            max-width: 520px;

            max-height: 90vh;

            overflow-y: auto;

            background: #101010;

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 20px;
        }


        /* CART HEADER */

        .cart-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .cart-header h2 {
            color: var(--gold);

            font-size: 22px;
        }

        .close-cart {
            width: 38px;

            height: 38px;

            border-radius: 50%;

            border: 1px solid var(--border);

            background: transparent;

            color: #ffffff;

            font-size: 22px;

            cursor: pointer;
        }


        /* EMPTY CART */

        .empty-cart {
            text-align: center;

            color: #888888;

            padding: 30px 10px;
        }


        /* CART ITEM */

        .cart-item {
            display: flex;

            align-items: center;

            gap: 10px;

            background: #171717;

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 10px;

            margin-bottom: 10px;
        }

        .cart-item-image {
            width: 65px;

            height: 65px;

            border-radius: 9px;

            object-fit: cover;

            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;

            min-width: 0;
        }

        .cart-item-name {
            font-size: 14px;

            margin-bottom: 5px;
        }

        .cart-item-price {
            color: var(--gold);

            font-size: 14px;

            margin-bottom: 7px;
        }


        /* QUANTITY */

        .quantity {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .quantity button {
            width: 28px;

            height: 28px;

            border: 1px solid var(--gold);

            background: transparent;

            color: var(--gold);

            border-radius: 6px;

            cursor: pointer;
        }

        .quantity span {
            min-width: 20px;

            text-align: center;
        }


        /* REMOVE */

        .remove-button {
            background: transparent;

            border: none;

            color: #ff5555;

            font-size: 18px;

            cursor: pointer;

            padding: 5px;
        }


        /* CART TOTAL */

        .cart-total {
            display: flex;

            align-items: center;

            justify-content: space-between;

            border-top: 1px solid var(--border);

            margin-top: 18px;

            padding-top: 18px;

            font-size: 20px;

            font-weight: bold;
        }

        .cart-total-value {
            color: var(--gold);
        }


        /* CHECKOUT */

        .checkout-button {
            width: 100%;

            border: none;

            background: var(--green);

            color: #ffffff;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 18px;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .products {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .hero h1 {
                font-size: 38px;
            }

            nav {
                gap: 15px;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            header {
                min-height: 76px;

                padding: 10px 15px;
            }

            nav {
                display: none;
            }

            .logo {
                gap: 8px;
            }

            .logo-icon {
                width: 52px;

                height: 52px;

                font-size: 26px;
            }

            .logo-text h2 {
                font-size: 18px;

                letter-spacing: 2px;
            }

            .logo-text p {
                font-size: 10px;
            }

            .cart-button {
                padding: 10px 12px;

                font-size: 13px;
            }


            /* HERO */

            .hero {
                width: calc(100% - 30px);

                min-height: 270px;

                margin: 25px auto;

                padding: 25px 15px;

                border-radius: 20px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 15px;

                line-height: 1.8;
            }

            .hero-button {
                padding: 13px 24px;
            }


            /* PRODUCTS */

            .section {
                width: calc(100% - 30px);

                margin: 45px auto;
            }

            .section-title {
                font-size: 27px;

                margin-bottom: 20px;
            }

            .products {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }

            .product {
                padding: 10px;

                border-radius: 15px;
            }

            .product-img {
                height: 155px;

                border-radius: 10px;
            }

            .product h3 {
                font-size: 14px;

                line-height: 1.6;
            }

            .product-description {
                font-size: 12px;

                line-height: 1.7;

                min-height: auto;
            }

            .price {
                font-size: 18px;
            }

            .buy-button {
                padding: 10px 5px;

                font-size: 13px;
            }


            /* CONTACT */

            .contact {
                padding: 25px 15px;
            }

            .contact h2 {
                font-size: 23px;
            }
        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .logo-text {
                display: none;
            }

            .cart-button {
                font-size: 12px;
            }

            .products {
                gap: 8px;
            }

            .product {
                padding: 8px;
            }

            .product-img {
                height: 135px;
            }

            .product h3 {
                font-size: 13px;
            }

            .product-description {
                font-size: 11px;
            }

            .price {
                font-size: 17px;
            }

            .buy-button {
                font-size: 12px;
            }
        }

    </style>
</head>
